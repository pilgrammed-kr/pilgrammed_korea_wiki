name: Deploy pilgrammed_korea_wiki (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install generator dependency
        run: python -m pip install beautifulsoup4
      - name: Build sitemap and canonical for actual Pages URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python make_sitemap.py "$PAGES_URL"
      - name: Local link and sitemap checks
        run: python verify_site.py --production
      - name: Offline HTML and JavaScript checks
        run: python qa_release.py
      - name: Prepare upload
        run: |
          mkdir -p _site
          cp -a index.html items copyright.html robots.txt sitemap.xml .nojekyll google*.html _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
